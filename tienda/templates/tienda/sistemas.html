
    <div class="toggle" onclick="toggleSistemas();">
    </div>
    <div class="sistemas col-lg-2 col-md-4 col-sm-12">
        <span class="">sistema</span>
        <ul class="ul_sis">
        {% for sistema in sistemas %}
            <li class="li_sis">
            <a class="sis" data-bs-toggle="collapse" href="#collapse{{ sistema.id }}" role="button" aria-expanded="false" aria-controls="collapse{{ sistema.id }}">
                {{ sistema.nombre }}
            </a>
            <div class="collapse categorias" id="collapse{{ sistema.id }}">
                <ul class="ul_cat">
                {% for categoria in sistema.categoria_set.all %}
                    <li class="li_cat"> <a href="{% url 'categoria' categoria.id %}" class="">{{ categoria.nombre }}</a></li>
                {% endfor %}
                </ul>
            </div>
            </li>
        {% endfor %}
        </ul>
    </div>
<script type="text/javascript">
        function toggleSistemas() {
            var sistemasToggle = document.querySelector('.toggle');
            sistemasToggle.classList.toggle('active');

            var sistemas = document.querySelector('.sistemas');
            sistemas.classList.toggle('active');
        }
</script>
<script type="text/javascript">
    window.addEventListener('scroll', function(){
        var nav_sistemas = document.querySelector('.nav_sistemas');
        nav_sistemas.classList.toggle('sticky', window.scrollY > 0);
    });
</script>
